<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Enter Ideal Day</title>
    <link rel="stylesheet" href="/gateway.css" />
    <script src="/gateway.js" defer></script>
  </head>
  <body>
    <main>
      <section aria-labelledby="login-title">
        <span>IDEAL DAY</span>
        <h1 id="login-title">Your day starts here.</h1>
        <p>Enter your private access password to continue.</p>
        <form>
          <label for="password">Access password</label>
          <div class="field">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus />
            <button type="submit">Continue</button>
          </div>
          <p class="error" role="alert" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
